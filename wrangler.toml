name = "memos-worker"
compatibility_date = "2025-08-19"
main = "src/index.js"
[assets]
directory = "./src/public"
run_worker_first = [
	"/api/*"
]

[[d1_databases]]
binding = "DB"
database_id = "03c4a235-d51a-40f3-ac35-36804c5bdda7"
database_name = "notes-db"

[[kv_namespaces]]
binding = "NOTES_KV"
id = "cc25c72216854b278f88db4208b4b44d"
preview_id = ""

[[r2_buckets]]
binding = "NOTES_R2_BUCKET"
bucket_name = "notes-r2-bucket"
preview_bucket_name = "notes-files-preview"
